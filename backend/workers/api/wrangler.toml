name = "crimeboard-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# === Default (dev) environment ===

account_id = "6c382be67dc62e7180d75b55c776e5fb"

[[d1_databases]]
binding = "DB"
database_name = "crimeboard-dev"
database_id = "8bc81f73-0772-439d-ab2a-6525c6d6606a"
migrations_dir = "../../migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "bc6447d1923245d1a1ea46b21585f49d"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "crimeboard-archive-dev"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "crimeboard-ingest-dev"

[[queues.producers]]
binding = "DEEPCHECK_QUEUE"
queue = "crimeboard-deepcheck-dev"

# Workers AI binding intentionally omitted from this worker — the api-worker doesn't
# use AI directly. AI inference happens in the cluster-builder and deep-check workers
# (added in later plans), which will declare `[ai] binding = "AI"` in their own
# wrangler.toml. Excluding AI here lets vitest-pool-workers run tests against this
# wrangler.toml without needing external AI worker emulation in miniflare.

[vars]
APPLE_AUDIENCE = "com.bworthy.receipts"
STUB_DELAY_MS = "600"
# SESSION_SECRET is set as a secret via `wrangler secret put SESSION_SECRET`.

# === Staging environment ===
# Deploy with: pnpm run deploy:staging

[env.staging]
name = "crimeboard-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "crimeboard-staging"
database_id = "8d232198-d453-4bca-afc2-897f2f85ca91"
migrations_dir = "../../migrations"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "f193bc63ea6a4d0daa350ed87f0591c9"

[[env.staging.r2_buckets]]
binding = "ARCHIVE"
bucket_name = "crimeboard-archive-staging"

[[env.staging.queues.producers]]
binding = "INGEST_QUEUE"
queue = "crimeboard-ingest-staging"

[[env.staging.queues.producers]]
binding = "DEEPCHECK_QUEUE"
queue = "crimeboard-deepcheck-staging"

# AI binding intentionally omitted (see note in default env above).

[env.staging.vars]
APPLE_AUDIENCE = "com.bworthy.receipts"
STUB_DELAY_MS = "600"

# === Production environment ===
# Deploy with: pnpm run deploy:prod

[env.production]
name = "crimeboard-api-prod"

[[env.production.d1_databases]]
binding = "DB"
database_name = "crimeboard-prod"
database_id = "482175de-c6d6-45c3-bc56-25adb05ef9ea"
migrations_dir = "../../migrations"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "b26c9166e7504d26bf70995a8ac0abdf"

[[env.production.r2_buckets]]
binding = "ARCHIVE"
bucket_name = "crimeboard-archive-prod"

[[env.production.queues.producers]]
binding = "INGEST_QUEUE"
queue = "crimeboard-ingest-prod"

[[env.production.queues.producers]]
binding = "DEEPCHECK_QUEUE"
queue = "crimeboard-deepcheck-prod"

# AI binding intentionally omitted (see note in default env above).

[env.production.vars]
APPLE_AUDIENCE = "com.bworthy.receipts"
STUB_DELAY_MS = "600"
