name: Receipts
options:
  bundleIdPrefix: com.bworthy
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.2
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O

packages:
  Models:
    path: Packages/Models
  APIClient:
    path: Packages/APIClient
  PersistenceKit:
    path: Packages/PersistenceKit
  OnDeviceAI:
    path: Packages/OnDeviceAI
  DesignSystem:
    path: Packages/DesignSystem
  Choreography:
    path: Packages/Choreography
  DailyBriefing:
    path: Packages/DailyBriefing
  DeepCheck:
    path: Packages/DeepCheck

targets:
  Receipts:
    type: application
    platform: iOS
    sources:
      - path: Receipts
        excludes:
          - "Info.plist"
    dependencies:
      - package: Models
      - package: APIClient
      - package: PersistenceKit
      - package: OnDeviceAI
      - package: DesignSystem
      - package: Choreography
      - package: DailyBriefing
      - package: DeepCheck
    settings:
      base:
        PRODUCT_NAME: Receipts
        PRODUCT_BUNDLE_IDENTIFIER: com.bworthy.receipts
        INFOPLIST_FILE: Receipts/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
